[project]
name = "transmute-cli"
version = "0.1.0"
description = "Convert YouTube or SoundCloud links into rich MP3s."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.12.6",
    "prompt_toolkit>=3.0.43",
    "anthropic>=0.60",
    "mutagen>=1.47",
]

[project.scripts]
transmute = "transmute.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transmute"]
