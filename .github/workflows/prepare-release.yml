name: prepare release

on:
  workflow_dispatch:

concurrency:
  group: prepare-release-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Increment numeric patch version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          init = Path("transmute/__init__.py")
          source = init.read_text(encoding="utf-8")
          match = re.fullmatch(r'__version__ = "(\d+)\.(\d+)\.(\d+)"\n?', source)
          if not match:
              raise SystemExit("Expected a numeric major.minor.patch version in transmute/__init__.py")
          major, minor, patch = map(int, match.groups())
          old = f"{major}.{minor}.{patch}"
          new = f"{major}.{minor}.{patch + 1}"
          init.write_text(f'__version__ = "{new}"\n', encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text, replacements = re.subn(rf"(?<![0-9]){re.escape(old)}(?![0-9])", new, text)
          if replacements < 1:
              raise SystemExit(f"README.md does not reference current version {old}")
          readme.write_text(text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={new}\n")
          print(f"Prepared {old} -> {new}")
          PY

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transmute/__init__.py README.md
          git commit -m "Release ${VERSION}"
          git tag "${VERSION}"
          git push origin HEAD:main "refs/tags/${VERSION}"

      - name: Start publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref main --field release_tag="${VERSION}"
